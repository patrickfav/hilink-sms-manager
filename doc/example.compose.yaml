services:
  hilink-sms:
    build: ..
    image: hilink-sms-manager:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HILINK_URL: ${HILINK_URL:-http://192.168.8.1}
      HILINK_USERNAME: ${HILINK_USERNAME:?set HILINK_USERNAME}
      HILINK_PASSWORD: ${HILINK_PASSWORD:?set HILINK_PASSWORD}
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH}
      POLL_INTERVAL: ${POLL_INTERVAL:-15s}
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://lte-stick-modem.example.com}
      LISTEN_ADDR: :8080
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
